name: melon_libtorrent
description: >-
  libtorrent 2.1 bindings for Flutter desktop (macOS, Windows, Linux) with a
  built-in HTTP streaming server for playing torrents while they download.
version: 0.1.1
repository: https://github.com/shirumesu/melon_libtorrent
issue_tracker: https://github.com/shirumesu/melon_libtorrent/issues
topics:
  - torrent
  - bittorrent
  - libtorrent
  - streaming
  - ffi

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  code_assets: ^2.2.0
  crypto: ^3.0.6
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  hooks: ^2.2.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      windows:
        ffiPlugin: true
  licenses:
    - licenses/boost.txt
    - licenses/libtorrent.txt
    - licenses/native-dependencies.txt
    - licenses/openssl.txt
